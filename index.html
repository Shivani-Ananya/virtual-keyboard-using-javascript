<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>Keyboard Sounds</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css?family=Arvo" rel="stylesheet">
</head>

<body>
  <h1 id="title">Keyboard 🎹 Sounds</h1>
  <div class="set">
    <button class="Note DO">DO (A)</button>
    <button class="Note RE">RE (S)</button>
    <button class="Note MI">MI (D)</button>
    <button class="Note FA">FA (F)</button>
    <button class="Note SOL">SOL (H)</button>
    <button class="Note LA">LA (J)</button>
    <button class="Note TI">TI (K)</button>
    <button class="Note TI">DO(high) (L)</button>
  </div>

  <footer>
    <h5>click the keys from keyboard to play</h5>
    ☀ Done by Shivani Ananya ☀
  </footer>

  <script src="index.js" charset="utf-8"></script>
</body>
</html>
